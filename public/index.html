:root{--bg:#f3f8fc;--surface:#fff;--ink:#16324f;--muted:#7088a3;--line:#e3edf6;--accent:#2b7de9;--accent-ink:#fff;--warn:#e8890c;--ok:#2bb08a;--use:#2b7de9;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a26;--surface:#132434;--ink:#e6f0f8;--muted:#8aa3b8;--line:#243a4d;--accent:#5aa2ff;--accent-ink:#08121c;--warn:#f5b04c;--ok:#54cfa8;--use:#5aa2ff}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1{font:700 32px/1 'Barlow Condensed',Barlow,sans-serif;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.stat b{display:block;font:700 28px/1 'Barlow Condensed',sans-serif}
.stat span{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px}
.tab{background:none;border:0;padding:10px 14px;font:600 16px Barlow,sans-serif;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.car{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:6px;padding:14px}
.car.uso{border-left-color:var(--use)}.car.rev{border-left-color:var(--warn)}
.plate{font:700 26px/1 'Barlow Condensed',sans-serif;letter-spacing:.06em}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.badge{font-size:13px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.livre{color:var(--ok)}.emuso{color:var(--use)}.alerta{color:var(--warn)}
.meta{color:var(--muted);font-size:14px;margin:6px 0 10px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:5px;padding:9px 14px;font:600 15px Barlow,sans-serif;cursor:pointer}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
input,select{font:400 16px Barlow,sans-serif;padding:9px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);width:100%}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:15px}
th{color:var(--muted);font-weight:600}
.empty{color:var(--muted);padding:24px;text-align:center}
.thumb{height:40px;border-radius:4px;vertical-align:middle}.note{color:var(--warn);font-weight:600;min-height:1.4em;margin:0 0 8px}.msg{color:var(--ok);font-weight:600;margin:8px 0 0;min-height:1.4em}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.dgrid .panel{margin:0}.dgrid h2{font:700 20px/1 'Barlow Condensed',sans-serif;margin:0 0 10px}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:12px}.kpi{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:6px;padding:12px}.kpi b{display:block;font:700 30px/1.1 'Barlow Condensed',sans-serif}.kpi span{color:var(--muted);font-size:14px}.bars{display:flex;gap:10px;align-items:flex-end;height:170px}.bc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:13px;color:var(--muted)}.bar{width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}.hr{display:grid;grid-template-columns:86px 1fr 84px;gap:8px;align-items:center;margin:8px 0;font-size:14px}.ht{background:var(--bg);height:10px;border-radius:5px}.hb{background:var(--accent);height:100%;border-radius:5px}.hr b{text-align:right}.li{padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}.li:last-child{border:0}
@media (max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
:root *{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif}
main{max-width:1040px;padding:32px 20px 56px}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em}
.stat,.kpi,.panel,.car{border:0;border-radius:14px;box-shadow:0 1px 3px rgba(15,30,61,.06)}
.stat b,.kpi b{font-weight:600;letter-spacing:-.02em}
.car.uso{box-shadow:inset 0 0 0 1.5px var(--accent)}
.car.rev{box-shadow:inset 0 0 0 1.5px var(--warn)}
.tabs{border:0;gap:6px;flex-wrap:wrap}
.tab{border-radius:99px;padding:8px 16px;margin:0;font-size:15px;font-weight:500;border:0}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.plate{font-size:21px;font-weight:600;letter-spacing:.04em}
.btn{border-radius:99px;padding:9px 18px;font-weight:500}
.btn.sec{border:0;background:var(--line);color:var(--ink)}
.badge{border:0;font-weight:500;background:color-mix(in srgb,currentColor 12%,transparent)}
.dgrid h2{font-size:16px;font-weight:600}
input,select{border-radius:10px;background:var(--surface)}
th{font-weight:500}
.bar{border-radius:6px 6px 0 0}
.livre{color:var(--ok)}.alerta{color:var(--warn)}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
body{background:var(--surface)}
.kpi,.panel,.car{background:var(--bg);box-shadow:none}
h1{display:flex;align-items:center;gap:10px;font-size:20px;margin:0 0 20px}
h1 .ic{width:26px;height:26px;color:var(--accent)}
.tab{display:inline-flex;align-items:center;gap:7px;background:none;color:var(--muted)}
.tab[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px}
.btn .ic{width:16px;height:16px}
.btn.ico{background:none;color:var(--muted);padding:8px}
.badge{display:inline-flex;align-items:center;gap:5px}.badge .ic{width:14px;height:14px}
.kpi span{display:flex;align-items:center;gap:6px}.kpi span .ic{width:16px;height:16px;color:var(--accent)}
@media (max-width:600px){.tab span{display:none}.tab[aria-selected="true"] span{display:inline}}
.seg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.seg-b{border:0;background:var(--bg);color:var(--muted);padding:6px 14px;border-radius:99px;font-size:14px;cursor:pointer}.seg-b[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}.kpi em{display:block;font-size:13px;font-style:normal;color:var(--muted);margin-top:2px}.print-only{display:none}
body{font-weight:300;letter-spacing:.005em}
main{max-width:1000px;padding:40px 24px 72px}
.ic{stroke-width:1.5}
h1{font-size:22px;font-weight:300;letter-spacing:-.01em;margin:0 0 28px;gap:12px}
h1 b{font-weight:600;color:var(--accent)}
h1 .ic{width:30px;height:30px}
.tabs{gap:2px;margin-bottom:28px}
.tab{font-weight:400;padding:8px 14px}
.kpi,.panel,.car{border-radius:18px;padding:18px}
.kpi b{font-weight:300;font-size:32px}
.car,.panel{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.car.uso{box-shadow:inset 0 0 0 1px var(--accent)}
.car.rev{box-shadow:inset 0 0 0 1px var(--warn)}
.plate{font-weight:500;letter-spacing:.08em;font-size:19px}
.grid,.dgrid{gap:18px}.kpis{gap:14px;margin-bottom:18px}
.btn{font-weight:400}.dgrid h2{font-weight:500}th{font-weight:400}b{font-weight:500}
body.mot .tabs,body.mot .gonly{display:none!important}
.pcrow{display:grid;gap:8px;align-items:end;margin-top:10px}.pcrow small{font-size:13px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px}.cmp img{width:100%;border-radius:12px;display:block;margin-top:6px}.cmp p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.role{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin:0 0 16px;flex-wrap:wrap}.role input{width:170px;padding:6px 10px}
@media (max-width:600px){.cmp{grid-template-columns:1fr}}
@media print{.tabs,.seg,.note,.btn{display:none!important}main{padding:0}section[hidden]{display:none}.print-only{display:block}*{color:#0f1e3d!important;background:#fff!important}.bar,.hb{background:#2b7de9!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}

<script>
const KEY='frota-v1';
let S={cars:[],log:[],drivers:[]};
S.fines=[];S.role='ges';
let driverCnhEdit=null;
let open=null,docOpen=null,note='',ed=null,cmp=null,pcOpen=null,rvOpen=null,pend={k:'',t:0};
const pending=k=>pend.k===k&&Date.now()-pend.t<6000;
const ask=(k,m)=>{if(pending(k)){pend={k:'',t:0};return true}pend={k,t:Date.now()};note=m;return false};
const $=s=>document.querySelector(s);
const fmt=n=>Number(n).toLocaleString('pt-BR');
const hoje=()=>new Date().toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short',timeZone:'America/Sao_Paulo'});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dias=d=>FleetInsights.daysUntil(d)??Infinity;
const venc=(nome,d)=>FleetInsights.dateAlert(nome,d)?.title||'';
const revisao=c=>!!FleetInsights.kmAlert('Revisão',c.prox,c.km);
function anom(c){const f=S.log.filter(l=>l.placa===c.placa&&l.litros&&l.km).sort((a,b)=>a.km-b.km);if(f.length<4)return '';const v=f.slice(1).map((x,i)=>(x.km-f[i].km)/x.litros),u=v.pop(),m=v.reduce((a,b)=>a+b,0)/v.length;return u<m*.75?'Consumo '+u.toFixed(1).replace('.',',')+' km/l, '+Math.round((1-u/m)*100)+'% abaixo da média':''}

function hist(){
  const rows=S.log.map((l,i)=>[l,i]).reverse().map(([l,i])=>ed===i?`<tr><td colspan="6"><div class="form"><label>Detalhe<input id="e1" value="${esc(l.det)}"></label><label>Valor<input id="e2" type="number" step="0.01" value="${esc(l.valor||'')}"></label><label>Km<input id="e3" type="number" value="${esc(l.km||'')}"></label><label>Litros<input id="e4" type="number" step="0.01" value="${esc(l.litros||'')}"></label><button class="btn sm" data-go="svlog:${i}">Salvar</button><button class="btn sm sec" data-go="cancel:0">Cancelar</button></div></td></tr>`:`<tr><td>${esc(l.quando)}</td><td>${esc(l.placa)}</td><td>${esc(l.tipo)}</td><td>${esc(l.det)} ${l.foto?`<img class="thumb" src="${esc(l.foto)}" alt="Foto do veículo">`:''}</td><td>${l.valor?'R$ '+fmt(l.valor):''}</td><td>${l.tipo==='Devolução'?`<button class="btn sm ico" data-go="cmp:${i}" title="Comparar fotos" aria-label="Comparar fotos">${ic('compare')}</button>`:''}<button class="btn sm ico" data-go="editlog:${i}" title="Editar registro" aria-label="Editar registro">${ic('edit')}</button><button class="btn sm ico" data-go="dellog:${i}" title="Excluir registro" aria-label="Excluir registro">${pending('dellog'+i)?'<span style="color:var(--warn)">Confirmar?</span>':ic('trash')}</button></td></tr>`).join('');
  $('#hist').innerHTML=cmpView()+(rows?`<div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn sm ico" data-go="clearlog:0">${pending('clearlog0')?'Confirmar?':ic('trash')+'Limpar histórico'}</button></div><div class="panel scroll"><table><thead><tr><th>Data</th><th>Veículo</th><th>Evento</th><th>Detalhe</th><th>Valor</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">Nenhum registro ainda. Retire um carro ou registre um abastecimento.</div>');
}
function fin(){
  const quem=f=>{const t=new Date(f.data).getTime();let c=null;S.log.filter(l=>l.placa===f.placa&&(l.tipo==='Saída'||l.tipo==='Devolução')).sort((a,b)=>a.t-b.t).forEach(l=>{if(l.t<=t)c=l.tipo==='Saída'?l.det.split(' → ')[0]:null});return c||'Sem saída registrada nesse horário'};
  const rows=S.fines.slice().sort((a,b)=>b.data.localeCompare(a.data)).map(f=>`<tr><td>${new Date(f.data).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</td><td>${esc(f.placa)}</td><td>${esc(quem(f))}</td><td>${esc(f.desc)}</td><td>R$ ${fmt(f.valor)}</td><td><button class="btn sm ${f.pago?'sec':''}" data-go="payf:${f.id}">${f.pago?'Paga':'Pendente'}</button></td><td><button class="btn sm ico" data-go="delf:${f.id}" aria-label="Excluir multa">${pending('delf'+f.id)?'Confirmar?':ic('trash')}</button></td></tr>`).join('');
  $('#fin').innerHTML=`<div class="panel"><div class="form"><label>Veículo<select id="fc">${S.cars.map(c=>`<option value="${c.id}">${esc(c.placa)} · ${esc(c.modelo)}</option>`).join('')}</select></label><label>Data e hora da infração<input id="fd" type="datetime-local"></label><label>Valor (R$)<input id="fv" type="number" step="0.01" inputmode="decimal"></label><label>Descrição<input id="fo"></label><button class="btn" data-go="addf:0">${ic('plus')}Registrar multa</button></div></div>`+(rows?`<div class="panel scroll"><table><thead><tr><th>Infração</th><th>Veículo</th><th>Motorista</th><th>Descrição</th><th>Valor</th><th>Situação</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">Nenhuma multa registrada.</div>');
}
function render(){fleetDraftEdited=false;rolebar();dash();cars();drv();logForm();hist();fin();renderAlertCenter();$('#note').textContent=note;note=''}
document.addEventListener('click',async e=>{
  const t=e.target.closest('.tab');
  if(t && cloud.context?.role==='driver')return;
  if(t){document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b===t));['dash','car','drv','log','fin','hist','alerts'].forEach(i=>$('#'+i).hidden=i!==t.dataset.t);return}
  const g=e.target.closest('[data-go]');if(!g)return;
  if(!cloud.csrf || cloud.busy || cloud.blocked)return;
  cloud.busy=true; $('#workspace').inert=true;
  try {
  const [a,id,x]=g.dataset.go.split(':');const c=S.cars.find(x=>x.id==id);
  if(cloud.context?.role==='driver') {
    if(!['open','cancel','out','in'].includes(a))return;
    if(a==='out'||a==='in') {
      await driverTrip(a,c);return;
    }
  }
  if(a==='open'){open=c.id;docOpen=null;pcOpen=null;rvOpen=null}
  if(a==='docs'){docOpen=c.id;open=null;pcOpen=null;rvOpen=null}
  if(a==='cancel'){open=null;docOpen=null;ed=null;cmp=null;pcOpen=null;rvOpen=null}
  if(a==='savedocs'){c.ipva=$('#d1').value;c.lic=$('#d2').value;c.seg=$('#d3').value;docOpen=null}
  if(a==='out'||a==='in'){await managerTrip(a,c);return;}
  if(a==='del'&&ask(a+id,'Clique de novo na lixeira para remover '+c.placa+'.'))S.cars=S.cars.filter(x=>x!==c);
  if(a==='add'){const p=$('#np').value.trim().toUpperCase(),m=$('#nm').value.trim(),k=Number($('#nk').value),r=Number($('#nr').value);
    if(p&&m)S.cars.push({id:Date.now(),placa:p,modelo:m,km:k||0,prox:r||(k||0)+10000,uso:null})}
  if(a==='editcnh')driverCnhEdit=Number(id);
  if(a==='cancelcnh')driverCnhEdit=null;
  if(a==='savecnh'){const driver=S.drivers.find(d=>d.id==id);if(driver){driver.cnh=$('#driver-cnh-date').value;driverCnhEdit=null;note='Validade da CNH atualizada.'}}
  if(a==='addd'){const n=$('#dn').value.trim();if(n)S.drivers.push({id:Date.now(),nome:n,cnh:$('#dc').value})}
  if(a==='deld')S.drivers=S.drivers.filter(x=>x.id!=id);
  if(a==='dellog'&&ask(a+id,''))S.log.splice(Number(id),1);
  if(a==='clearlog'&&ask(a+id,''))S.log=[];
  if(a==='per')per=id;
  if(a==='print'){window.print();return}
  if(a==='editlog')ed=Number(id);
  if(a==='svlog'){const l=S.log[Number(id)];if(l){l.det=$('#e1').value;l.valor=Number($('#e2').value)||0;l.litros=Number($('#e4').value)||0;if(l.km||$('#e3').value)l.km=Number($('#e3').value)||0}ed=null}
  if(a==='addf'){const v=S.cars.find(x=>x.id==$('#fc').value),d=$('#fd').value;if(v&&d)S.fines.push({id:Date.now(),placa:v.placa,data:d,valor:Number($('#fv').value)||0,desc:$('#fo').value.trim(),pago:false});else note='Informe o veículo e a data da infração.'}
  if(a==='payf'){const f=S.fines.find(x=>x.id==id);if(f)f.pago=!f.pago}
  if(a==='delf'&&ask(a+id,''))S.fines=S.fines.filter(z=>z.id!=id);
  if(a==='cmp')cmp=Number(id);
  if(a==='pecas'){pcOpen=c.id;open=null;docOpen=null;rvOpen=null}
  if(a==='svpec'){c.pecas=[0,1,2].map(i=>{const t=$('#pt'+i).value;return {troca:t===''?null:Number(t),vida:Number($('#pv'+i).value)||PV[i]}});pcOpen=null;note='Peças salvas.'}
  if(a==='troca'){const i=Number(x);c.pecas=c.pecas||[null,null,null];c.pecas[i]={troca:c.km,vida:Number($('#pv'+i).value)||PV[i]};S.log.push({quando:hoje(),t:Date.now(),placa:c.placa,tipo:'Troca de peça',det:PN[i]+' trocado aos '+fmt(c.km)+' km',valor:0})}
  if(a==='modo')S.role='mot';
  if(a==='gest')S.role='ges';
  if(a==='revis'){rvOpen=c.id;open=null;docOpen=null;pcOpen=null}
  if(a==='svrev'){const k=Number($('#rk').value);if(k>0){c.prox=k;c.revdata=$('#rd').value;rvOpen=null;note='Revisão atualizada.'}else note='Informe o km da próxima revisão.'}
  if(a==='revok'){rvOpen=null;c.prox=c.km+10000;c.revdata='';S.log.push({quando:hoje(),t:Date.now(),placa:c.placa,tipo:'Revisão',km:c.km,det:'Revisão feita aos '+fmt(c.km)+' km',valor:0});note='Revisão registrada. Próxima aos '+fmt(c.prox)+' km.'}
  if(a==='reg'){const v=S.cars.find(x=>x.id==$('#lc').value);if(v){const k=Number($('#lk').value),tp=$('#lt').value;
    if(k>v.km)v.km=k;if(tp==='Troca de óleo'||tp==='Revisão')v.prox=v.km+10000;
    S.log.push({quando:hoje(),t:Date.now(),placa:v.placa,tipo:tp,km:k||0,litros:Number($('#ll').value)||0,det:(k?fmt(k)+' km. ':'')+$('#lo').value,valor:Number($('#lv').value)||0});note='Registro salvo.'}}
  await save();render();
  if(a==='modo')navigateLayout('car');
  if(a==='gest'&&S.role==='ges')$('.tab[data-t="dash"]').click();
  } finally {cloud.busy=false; $('#workspace').inert=cloud.blocked;}
});
